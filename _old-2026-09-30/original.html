<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thrucket</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-subtle: #252525;
      --border: #333333;
      --text: #f0f0f0;
      --muted: #a0a0a0;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --badge-5: #10b981;
      --badge-15: #3b82f6;
      --badge-30: #8b5cf6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    .app-wrap { width: 100%; max-width: 600px; }
    header { margin-bottom: 20px; text-align: center; }
    h1 { margin: 0 0 6px 0; font-size: 2rem; letter-spacing: -0.5px; font-weight: 800; }
    .tagline { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .search-box { margin-bottom: 24px; margin-top: 16px; }
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .container-showcase { display: flex; flex-direction: column; gap: 20px; }
    .tier-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .tier-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .tier-title { font-weight: 700; font-size: 1.15rem; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .band-5 { background: rgba(16, 185, 129, 0.15); color: var(--badge-5); border: 1px solid rgba(16, 185, 129, 0.3); }
    .band-15 { background: rgba(59, 130, 246, 0.15); color: var(--badge-15); border: 1px solid rgba(59, 130, 246, 0.3); }
    .band-30 { background: rgba(139, 92, 246, 0.15); color: var(--badge-30); border: 1px solid rgba(139, 92, 246, 0.3); }
    .card {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .card-body { display: flex; gap: 16px; padding: 14px; }
    .thumb-wrap {
      width: 110px;
      height: 110px;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-weight: 600; font-size: 1.05rem; margin-bottom: 4px; }
    .card-meta { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .card-meta b { color: var(--text); }
    .card-footer {
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--border);
    }
    .buy-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--accent);
      color: #000;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: background 0.15s;
    }
    .buy-btn:hover { background: var(--accent-hover); }
    .tier-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      border: 1px dashed var(--border);
      border-radius: 6px;
    }
    .search-grid { display: flex; flex-direction: column; gap: 16px; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header>
      <h1>Thrucket</h1>
      <p class="tagline">Physical inventory verified & ready to ship</p>
    </header>

    <div class="search-box">
      <input type="text" id="query" placeholder="Search brand, style, size..." autocomplete="off">
    </div>

    <div id="results">
      <div class="tier-empty">Loading inventory...</div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby9D6VxPI8xlvlvlBRdr-wXlhbr49J1hxuVCth7QJQKWHQInjl8oEWoEdryeJnbpHYb/exec?format=json";
    let inventory = [];

    function resolvePhoto(url) {
      if (!url) return "";
      url = String(url).trim();
      if (url.includes("drive.google.com") && url.includes("id=")) {
        const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) {
          return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w800`;
        }
      }
      return url;
    }

    function buildCard(it) {
      const img = it.photo 
        ? `<img src="${it.photo}" alt="${it.brand}" loading="lazy" onerror="this.parentElement.innerHTML='Photo unavailable'">`
        : `<span>Photo pending</span>`;

      return `
        <div class="card">
          <div class="card-body">
            <div class="thumb-wrap">${img}</div>
            <div class="card-info">
              <div>
                <div class="card-title">${it.brand || "Vintage"} ${it.style ? '· ' + it.style : ''}</div>
                <div class="card-meta">
                  Size: <b>${it.size || "See measurements"}</b><br>
                  ${it.measurements ? it.measurements + '<br>' : ''}
                  ${it.flaws && it.flaws !== 'none' ? '<span style="color:#ef4444">Note: ' + it.flaws + '</span>' : 'Condition: ' + (it.condition || 'Good')}
                </div>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <a class="buy-btn" href="${it.payment_link}" target="_blank" rel="noopener">Buy Now — $${it.band}</a>
          </div>
        </div>
      `;
    }

    function renderTiers() {
      const bands = [
        { tier: 5, label: "Micro Container" },
        { tier: 15, label: "Base Container" },
        { tier: 30, label: "Premium Container" }
      ];

      const html = bands.map(b => {
        const latest = [...inventory].reverse().find(it => 
          Number(it.band) === b.tier && 
          it.payment_link && 
          it.payment_link.startsWith("https://buy.stripe.com/") &&
          String(it.sold).toLowerCase() !== "true"
        );

        return `
          <div class="tier-container">
            <div class="tier-header">
              <span class="tier-title">$${b.tier} ${b.label}</span>
              <span class="badge band-${b.tier}">Verified Drop</span>
            </div>
            ${latest ? buildCard(latest) : `<div class="tier-empty">Next drop coming soon.</div>`}
          </div>
        `;
      }).join("");

      document.getElementById("results").innerHTML = `<div class="container-showcase">${html}</div>`;
    }

    function renderSearch(query) {
      const q = query.toLowerCase();
      const matches = inventory.filter(it => 
        (it.brand && it.brand.toLowerCase().includes(q)) ||
        (it.size && it.size.toLowerCase().includes(q)) ||
        (it.style && it.style.toLowerCase().includes(q)) ||
        (it.category && it.category.toLowerCase().includes(q))
      );

      if (!matches.length) {
        document.getElementById("results").innerHTML = `
          <div class="tier-empty">No garments matching "${query}". Showing latest containers soon.</div>
        `;
        return;
      }

      document.getElementById("results").innerHTML = `
        <div class="search-grid">
          ${matches.map(it => buildCard(it)).join("")}
        </div>
      `;
    }

    document.getElementById("query").addEventListener("input", (e) => {
      const val = e.target.value.trim();
      if (!val) {
        renderTiers();
      } else {
        renderSearch(val);
      }
    });

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        const raw = data.items || data || [];
        inventory = raw.map(it => ({
          ...it,
          band: Number(it.band || 15),
          photo: resolvePhoto(it.photo || it.photos || it.photo_url)
        }));
        renderTiers();
      })
      .catch(err => {
        console.error(err);
        document.getElementById("results").innerHTML = `<div class="tier-empty">Unable to connect to live inventory. Please refresh.</div>`;
      });
  </script>
</body>
</html>
