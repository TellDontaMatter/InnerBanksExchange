<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inner Banks Exchange — Intake Portal</title>
  <style>
    :root { --bg-color:#0b0b0f; --card-bg:#14141c; --accent:#00ffcc; --text:#f0f0f5; --text-muted:#8a8a9e; --border:#262636; --danger:#ff4444; }
    * { box-sizing: border-box; }
    body { background:var(--bg-color); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; margin:0; padding:20px; }
    .container { max-width:600px; margin:40px auto; background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:24px; box-shadow:0 8px 24px rgba(0,0,0,.5); }
    h2 { margin-top:0; color:var(--accent); font-size:1.5rem; }
    .form-group { margin-bottom:16px; }
    label { display:block; font-size:.9rem; color:var(--text-muted); margin-bottom:6px; }
    input, select { width:100%; padding:12px; background:#1e1e28; border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:1rem; }
    input:focus, select:focus { outline:none; border-color:var(--accent); }
    input.invalid { border-color:var(--danger); }
    .err { color:var(--danger); font-size:.85rem; margin-top:4px; }
    button { background:var(--accent); color:#000; border:none; padding:14px; font-weight:bold; width:100%; border-radius:6px; font-size:1rem; cursor:pointer; margin-top:10px; touch-action:manipulation; }
    button:disabled { opacity:.5; cursor:wait; }
    .thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(88px, 1fr)); gap:8px; margin-top:10px; }
    .thumbs:empty { display:none; }
    .thumb { position:relative; aspect-ratio:1; }
    .thumb img { width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--border); }
    .thumb button { position:absolute; top:4px; right:4px; width:30px; height:30px; min-height:0; margin:0; padding:0; border-radius:50%; background:#000c; color:#fff; font-size:18px; line-height:1; }
    .thumb .cover { position:absolute; left:4px; bottom:4px; background:#000c; color:var(--accent); font:600 11px monospace; padding:2px 6px; border-radius:4px; }
    #status-msg a { color:var(--accent); }
    #status-msg { margin-top:16px; text-align:center; font-size:.95rem; font-family:monospace; overflow-wrap:anywhere; }
    .ok { color:var(--accent); } .bad { color:var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <h2>IBX Intake Portal</h2>
    <p style="color:var(--text-muted);margin-bottom:24px">List a new item on the exchange.</p>

    <form id="intake-form" novalidate>
      <div class="form-group">
        <label for="item-name">Item Name / Title</label>
        <input type="text" id="item-name" maxlength="200" placeholder="e.g., Core Rig Asset #4" autocomplete="off">
        <div class="err" id="e-name"></div>
      </div>
      <div class="form-group">
        <label for="item-price">Price ($)</label>
        <input type="number" inputmode="decimal" step="0.01" min="0" id="item-price" placeholder="0.00">
        <div class="err" id="e-price"></div>
      </div>
      <div class="form-group">
        <label for="item-category">Category</label>
        <input type="text" id="item-category" maxlength="100" placeholder="e.g., Hardware, Concierge, Equipment" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="item-photo">Photos (optional, up to 6)</label>
        <input type="file" id="item-photo" accept="image/*" multiple>
        <div class="thumbs" id="thumbs"></div>
        <div class="err" id="e-photo"></div>
      </div>
      <div class="form-group">
        <label for="item-status">Status</label>
        <select id="item-status">
          <option value="Available">Available</option>
          <option value="Pending">Pending</option>
          <option value="Reserved">Reserved</option>
        </select>
      </div>
      <button type="submit" id="submit-btn">Submit item</button>
    </form>
    <div id="status-msg" role="status" aria-live="polite"></div>
  </div>

  <script>
    const form = document.getElementById('intake-form');
    const statusMsg = document.getElementById('status-msg');
    const submitBtn = document.getElementById('submit-btn');
    const FIELD_INPUT = { name: 'item-name', price: 'item-price', photo: 'item-photo' };

    function show(text, ok) { statusMsg.className = ok ? 'ok' : 'bad'; statusMsg.textContent = text; }
    function showFieldErrors(fields) {
      for (const k of Object.keys(FIELD_INPUT)) {
        document.getElementById('e-' + k).textContent = (fields && fields[k]) || '';
        document.getElementById(FIELD_INPUT[k]).classList.toggle('invalid', !!(fields && fields[k]));
      }
    }

    // Shrinks the photo on the phone so uploads are fast and fit the server limit.
    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that photo. Try a JPEG or PNG.')); };
        img.src = url;
      });
    }
    const MAX_PHOTOS = 6;
    let files = [];
    const thumbsEl = document.getElementById('thumbs');
    const photoInput = document.getElementById('item-photo');

    // Shrinks one photo on the phone so uploads are fast and fit the server limit.
    async function shrinkPhoto(file) {
      const img = await loadImage(file);
      for (const [max, q] of [[800, 0.7], [640, 0.6], [480, 0.5], [360, 0.45]]) {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const data = c.toDataURL('image/jpeg', q);
        if (data.length < 190000) return data;
      }
      throw new Error('"' + file.name + '" is too large even after shrinking. Pick a smaller one.');
    }

    function renderThumbs() {
      thumbsEl.replaceChildren();
      files.forEach((f, i) => {
        const box = document.createElement('div'); box.className = 'thumb';
        const img = document.createElement('img'); img.alt = 'Photo ' + (i + 1); img.src = URL.createObjectURL(f); img.onload = () => URL.revokeObjectURL(img.src);
        const rm = document.createElement('button'); rm.type = 'button'; rm.textContent = '×'; rm.setAttribute('aria-label', 'Remove photo ' + (i + 1));
        rm.onclick = () => { files.splice(i, 1); renderThumbs(); };
        box.append(img, rm);
        if (i === 0) { const c = document.createElement('span'); c.className = 'cover'; c.textContent = 'COVER'; box.append(c); }
        thumbsEl.append(box);
      });
    }

    photoInput.addEventListener('change', () => {
      const picked = Array.from(photoInput.files);
      photoInput.value = ''; // lets you pick more photos in another batch
      const room = MAX_PHOTOS - files.length;
      files = files.concat(picked.slice(0, Math.max(0, room)));
      showFieldErrors({ photo: picked.length > room ? 'Only ' + MAX_PHOTOS + ' photos per item. Extra photos were skipped.' : '' });
      renderThumbs();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showFieldErrors(null);
      const name = document.getElementById('item-name').value.trim();
      const priceRaw = document.getElementById('item-price').value.trim();
      const price = Number(priceRaw);
      const local = {};
      if (!name) local.name = 'Name is required';
      if (priceRaw === '' || !Number.isFinite(price) || price < 0) local.price = 'Enter a price, 0 or more';
      if (Object.keys(local).length) { showFieldErrors(local); show('Fix the highlighted fields.', false); return; }

      submitBtn.disabled = true;
      show('Saving…', true);
      try {
        const photos = [];
        for (let i = 0; i < files.length; i++) { show('Preparing photo ' + (i + 1) + ' of ' + files.length + '…', true); photos.push(await shrinkPhoto(files[i])); }
        show('Saving…', true);
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 20000);
        let res;
        try {
          res = await fetch('/api/items', {
            method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name, price,
              category: document.getElementById('item-category').value.trim(),
              status: document.getElementById('item-status').value,
              photos,
            }),
          });
        } finally { clearTimeout(timer); }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { showFieldErrors(data.fields); throw new Error(data.error || 'Request failed (' + res.status + ')'); }
        statusMsg.className = 'ok'; statusMsg.textContent = '✔ Saved. "' + data.name + '" is now in the shop. ';
        const link = document.createElement('a'); link.href = data.shareUrl; link.textContent = 'View and share the card →'; statusMsg.append(link);
        form.reset(); files = []; renderThumbs();
      } catch (err) {
        show('✖ ' + (err.name === 'AbortError' ? 'Timed out. Check your connection and try again.' : err.message), false);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
